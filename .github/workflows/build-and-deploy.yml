name: Build and publish update site

# Builds the Tycho update site on every push/PR, runs the test fragment
# under a virtual display via xvfb, and on pushes to master also publishes
# the update site to GitHub Pages. Tag pushes build and test but never
# deploy -- see the deploy job for why.
#
# On every successful build, uploads the update site as a downloadable
# GitHub Actions artifact so PRs from feature branches can be installed
# locally for testing without waiting for a release.
#
# Publishing a GitHub release rebuilds at that tag and attaches the update
# site as jucmnav-update-site-<tag>.zip, giving each version a permanent,
# installable artifact. That path deliberately does NOT touch Pages: a
# release can be published from an older tag, and deploying it would
# overwrite the live site with a stale build.
#
# Tests: seg.jUCMNav.tests/ is an eclipse-test-plugin fragment of
# seg.jUCMNav. `mvn -B clean verify` runs the JUnit suite inside a headless
# Eclipse UI harness; failures fail this workflow. See `seg.jUCMNav.tests/pom.xml`
# for surefire configuration (useUIHarness + useUIThread).
#
# After the first successful Pages deploy, enable Pages in the repo settings:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Users then install jUCMNav by adding the Pages URL as an update site:
#   https://<org-or-user>.github.io/<repo>/

on:
  push:
    branches: [ master, modernization ]
    tags: [ 'v*' ]
  pull_request:
  # Publishing a release rebuilds at that tag and attaches the update site as a
  # downloadable zip. This is a separate trigger from the tag push above because
  # a release is often published from a tag that already exists, in which case no
  # push event fires at all.
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write   # required to upload release assets
  pages: write
  id-token: write

# NOTE: the `pages` concurrency group is declared on the deploy job, NOT here.
# At workflow level it applied to every run -- PRs, modernization pushes, tag
# pushes, release rebuilds -- even though only master ever deploys. Since GitHub
# keeps just the newest *pending* run in a group, an unrelated run queueing
# behind a master build silently cancelled it, taking the deploy with it. That
# cost the v10.0.5 release its Pages deploy twice. Scope the group to the job
# that actually needs serializing.

jobs:
  build:
    runs-on: ubuntu-latest
    # A wedged test should cost minutes, not the six-hour default. The suite finishes well inside
    # ten; anything past this is stuck rather than slow. Learned the hard way: a modal dialog with
    # nobody to dismiss it held JUCMNavGRLCommandTests for six hours before the job timed out, by
    # which point the run had blocked every later push behind it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so the jgit timestamp provider works

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # UI / plug-in tests need a display; provide a virtual one. The
      # eclipse-test-plugin fragment boots a headless workbench during
      # `verify`, which needs a Display.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build + test (Tycho)
        run: xvfb-run -a mvn -B clean verify

      # Always: downloadable artifact from the Actions UI. Lets reviewers of
      # PRs from any branch install the built update site locally for testing.
      - name: Upload update site (downloadable artifact)
        uses: actions/upload-artifact@v7
        with:
          name: jucmnav-update-site
          path: seg.jUCMNav.repository/target/repository
          if-no-files-found: error
          retention-days: 30

      # On a published release: attach the built update site as a versioned zip
      # so a specific version can be installed offline or archived, independently
      # of the rolling Pages site (which always serves the newest master build).
      - name: Attach update site to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ZIP=$(ls seg.jUCMNav.repository/target/*.zip | head -n1)
          ASSET="jucmnav-update-site-${TAG}.zip"
          cp "$ZIP" "$ASSET"
          gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

      # Only on master: drop a landing page into the update site so the Pages
      # root URL doesn't 404 (the p2 repo itself has no index.html), then
      # prepare the Pages artifact for deploy.
      #
      # Deliberately NOT on release events: a release can be published from an
      # old tag, and deploying that build would overwrite the live update site
      # with an older version. Releases only attach their own zip (above).
      #
      # Deliberately NOT on tag pushes either. The github-pages environment
      # permits exactly one deployment ref -- the *branch* master -- so a tag
      # can never satisfy it whatever the tag is called, and asking anyway just
      # fails the run ("Tag vX is not allowed to deploy to github-pages due to
      # environment protection rules"). Worse, the tag push and the master push
      # of a release land in the same `pages` concurrency group seconds apart:
      # whichever queues second supersedes the other, so a tag run could cancel
      # the master run that was going to do the real deploy and then fail its
      # own. That is what happened to v10.0.5. Pages is master's job alone.
      # Pages URL and source URL are derived from the runtime workflow
      # context so they keep working after a repo transfer (e.g. from
      # damyot/ to JUCMNAV/) without a manual template edit.
      - name: Generate landing page
        if: github.event_name != 'release' && github.ref == 'refs/heads/master'
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
        run: |
          PAGES_URL="https://${OWNER,,}.github.io/${REPO_NAME}/"
          SOURCE_URL="https://github.com/${REPO_FULL}"
          cat > seg.jUCMNav.repository/target/repository/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>jUCMNav update site</title>
            <style>
              body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
                     max-width: 720px; margin: 4em auto; padding: 0 1em; color: #222; }
              code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
              pre  { background: #f4f4f4; padding: 1em; border-radius: 6px; overflow-x: auto; }
              a    { color: #0366d6; }
            </style>
          </head>
          <body>
            <h1>jUCMNav update site</h1>
            <p>This URL is an Eclipse p2 update site, not a regular web page.</p>
            <h2>Install in Eclipse</h2>
            <ol>
              <li>In Eclipse: <em>Help &rarr; Install New Software&hellip;</em></li>
              <li>Paste this URL into the <em>Work with</em> field:
                  <pre>${PAGES_URL}</pre></li>
              <li>Select <em>jUCMNav</em> and finish the wizard.</li>
            </ol>
            <p>To check for updates later: <em>Help &rarr; Check for Updates</em>.</p>
            <p>Source: <a href="${SOURCE_URL}">${REPO_FULL}</a></p>
          </body>
          </html>
          EOF

      - name: Upload update site (Pages artifact)
        if: github.event_name != 'release' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: seg.jUCMNav.repository/target/repository

  deploy:
    needs: build
    if: github.event_name != 'release' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Don't run overlapping Pages deployments. Only this job contends, so a
    # build on any other ref can no longer supersede a master run.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
